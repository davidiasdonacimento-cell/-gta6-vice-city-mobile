name: Validate and build Godot Web

on:
  push:
    branches:
      - rebuild/godot-cross-platform
  workflow_dispatch:

jobs:
  godot:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Godot 4.4.1 and Web export templates
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/godot" "$HOME/.local/share/godot/export_templates/4.4.1.stable"
          curl -fL --retry 3 "https://github.com/godotengine/godot/releases/download/4.4.1-stable/Godot_v4.4.1-stable_linux.x86_64.zip" -o "$RUNNER_TEMP/godot.zip"
          unzip -q "$RUNNER_TEMP/godot.zip" -d "$RUNNER_TEMP/godot"
          mv "$RUNNER_TEMP/godot/Godot_v4.4.1-stable_linux.x86_64" "$RUNNER_TEMP/godot/godot"
          chmod +x "$RUNNER_TEMP/godot/godot"
          echo "$RUNNER_TEMP/godot" >> "$GITHUB_PATH"
          curl -fL --retry 3 "https://github.com/godotengine/godot/releases/download/4.4.1-stable/Godot_v4.4.1-stable_export_templates.tpz" -o "$RUNNER_TEMP/templates.tpz"
          unzip -q "$RUNNER_TEMP/templates.tpz" -d "$RUNNER_TEMP/templates"
          cp -a "$RUNNER_TEMP/templates/templates/." "$HOME/.local/share/godot/export_templates/4.4.1.stable/"

      - name: Import and parse project
        run: godot --headless --editor --path godot --quit

      - name: Start main scene headlessly
        run: godot --headless --path godot --quit-after 5

      - name: Export browser build
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p godot/build/web
          godot --headless --path godot --export-release "Web" "$GITHUB_WORKSPACE/godot/build/web/index.html"
          test -s godot/build/web/index.html

      - name: Upload browser build
        uses: actions/upload-artifact@v4
        with:
          name: vice-city-web
          path: godot/build/web/
          if-no-files-found: error
          retention-days: 14
