<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#07131b">
  <meta name="description" content="Vice City Mobile — projeto independente de mundo aberto 3D para navegador e Android.">
  <title>Vice City Mobile</title>
</head>
<body>
  <div id="loading"><div class="load-mark">VC</div><strong>VICE CITY</strong><span>Carregando a cidade...</span><div class="load-track"><i></i></div></div>
  <div id="game"></div>
  <div id="hud">
    <header class="topbar"><div class="brand"><b>VICE</b><span>CITY</span><small>MOBILE</small></div><div class="hud-right"><div class="clock" id="clock">12:00</div><div class="cash">$ 2.450</div></div></header>
    <div class="mission"><small>OBJETIVO ATUAL</small><strong>Explore Vice City</strong><span>Conheça a cidade e encontre seu caminho.</span></div>
    <div class="minimap-frame"><canvas id="minimap" width="180" height="180"></canvas><span class="map-north">N</span></div>
    <div class="touch-controls">
      <div id="stick-zone" class="stick-zone"><div id="stick-base"><div id="stick-knob"></div></div></div>
      <div class="action-stack"><button id="run-btn" class="action-btn">CORRER</button><button id="enter-btn" class="action-btn primary">ENTRAR</button></div>
    </div>
    <div class="hint" id="hint">Arraste o lado esquerdo para andar · Arraste a tela para girar a câmera</div>
  </div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
